name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: event_hub_test
          MYSQL_PASSWORD: event_hub_test
          MYSQL_ROOT_PASSWORD: event_hub_test_root
          MYSQL_USER: event_hub_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1
          --user=event_hub_test --password=event_hub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    env:
      TEST_DATABASE_URL: mysql://event_hub_test:event_hub_test@127.0.0.1:3307/event_hub_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, contract, and component tests
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm db:test:migrate

      - name: Run API integration tests
        run: pnpm test:integration

      - name: Build production artifacts
        run: pnpm build
